services:
  wireproxy:
    image: wireproxy:latest
    command: ["-s", "-c", "/etc/wireproxy/config"]
    ports:
      - "1080:1080"
    volumes:
      - /etc/wireproxy/cn.conf:/etc/wireproxy/config
    networks:
      - vpn_net
    logging:
      driver: "none"
    depends_on:
      iptables-setup:
        condition: service_completed_successfully

  iptables-setup:
    image: alpine:latest
    network_mode: "host"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    command: >
      sh -c "
        apk add --no-cache iptables &&
        iptables -t nat -D POSTROUTING -s 192.168.100.0/24 -o enp2s0 -j MASQUERADE 2>/dev/null || true &&
        iptables -t nat -I POSTROUTING -s 192.168.100.0/24 -o enp2s0 -j MASQUERADE
      "
    restart: "no"

networks:
  vpn_net:
    name: vpn_net
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
    ipam:
      config:
        - subnet: 192.168.100.0/24
